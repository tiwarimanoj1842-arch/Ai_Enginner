<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask my AI — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1030; --panel:#141842; --line:#262b66; --text:#e9ebff; --mute:#9aa0d6;
  --iris:#8c9bff; --mint:#79e6c4; --user:#2a3190;
  --display:"Bricolage Grotesque",Georgia,sans-serif; --body:"Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.6 var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

/* animated aurora backdrop */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vw;height:46vw;background:#4a55e8;left:-8vw;top:-12vw}
.aurora i:nth-child(2){width:38vw;height:38vw;background:#1fb899;right:-10vw;top:20vh;animation-duration:28s;opacity:.32}
.aurora i:nth-child(3){width:30vw;height:30vw;background:#8a4de0;left:30vw;bottom:-14vw;animation-duration:34s;opacity:.4}
@keyframes drift{to{transform:translate(8vw,6vh) scale(1.15)}}

.app{position:relative;z-index:1;display:grid;grid-template-columns:288px 1fr;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* sidebar */
.side{background:rgba(20,24,66,.72);backdrop-filter:blur(14px);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font:700 18px var(--display)}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--iris),var(--mint));display:grid;place-items:center;color:#0d1030;font:800 15px var(--display)}
.new{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-weight:600;transition:background .2s,border-color .2s}
.new:hover{background:rgba(140,155,255,.12);border-color:var(--iris)}
.hist-title{margin:20px 10px 8px;font-size:13px;color:var(--mute);font-weight:500}
.hist{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;color:var(--mute);text-align:left;transition:background .15s,color .15s}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.item:hover,.item.on{background:rgba(140,155,255,.14);color:var(--text)}
.item .del{opacity:0;padding:2px 6px;border-radius:6px;font-size:16px;line-height:1}
.item:hover .del,.item:focus-within .del{opacity:1}
.item .del:hover{background:rgba(255,120,120,.25)}
.empty{padding:10px;font-size:14px;color:var(--mute)}
.links{display:flex;gap:14px;padding:12px 10px 2px;border-top:1px solid var(--line);font-size:14px}
.links a{color:var(--mute);text-decoration:none}.links a:hover{color:var(--mint)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:none;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.stream{flex:1;overflow:auto;padding:28px 20px 8px;scroll-behavior:smooth}
.col{max-width:780px;margin:0 auto}

/* hero (empty state) */
.hero{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:4vh 0 2vh}
.hero .hi{display:inline-flex;align-items:center;gap:8px;color:var(--mint);font-weight:600;font-size:15px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(121,230,196,0);}0%{box-shadow:0 0 0 0 rgba(121,230,196,.5)}}
h1{font:800 clamp(40px,7vw,76px)/1.02 var(--display);letter-spacing:-.03em;margin:14px 0 14px;background:linear-gradient(100deg,#fff 20%,var(--iris) 60%,var(--mint));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s ease-in-out infinite alternate}
@keyframes shine{to{background-position:100% 0}}
.hero p.lead{max-width:56ch;color:var(--mute);font-size:18px}
.marquee{margin:30px 0 26px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.track{display:flex;gap:10px;width:max-content;animation:scroll 32s linear infinite}
.track b{font-weight:500;font-size:14px;padding:6px 14px;border:1px solid var(--line);border-radius:99px;background:rgba(20,24,66,.6);white-space:nowrap}
@keyframes scroll{to{transform:translateX(-50%)}}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.chip{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(20,24,66,.55);text-align:left;font-size:15px;transition:transform .2s,border-color .2s,background .2s}
.chip:hover{transform:translateY(-3px);border-color:var(--iris);background:rgba(140,155,255,.13)}
.reveal>*{opacity:0;transform:translateY(14px);animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
.reveal>*:nth-child(2){animation-delay:.1s}.reveal>*:nth-child(3){animation-delay:.2s}.reveal>*:nth-child(4){animation-delay:.3s}.reveal>*:nth-child(5){animation-delay:.4s}
@keyframes up{to{opacity:1;transform:none}}

/* messages */
.msg{display:flex;gap:12px;margin:0 0 22px;animation:up .35s ease both}
.msg.user{justify-content:flex-end}
.av{flex:none;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--iris),var(--mint));display:grid;place-items:center;color:#0d1030;font:800 14px var(--display)}
.bub{max-width:min(640px,86%);overflow-wrap:anywhere}
.user .bub{background:var(--user);padding:10px 16px;border-radius:18px 18px 4px 18px}
.bot .bub p{margin:0 0 10px}.bot .bub p:last-child{margin:0}
.bot .bub ul,.bot .bub ol{margin:0 0 10px 22px}
.bot .bub code{background:rgba(140,155,255,.18);padding:1px 6px;border-radius:6px;font-size:.9em}
.err .bub{color:#ffb4b4}
.typing{display:flex;gap:5px;padding:12px 0}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--iris);animation:bounce 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-6px);opacity:1}}

/* composer */
.comp{padding:8px 20px 18px}
.box{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:rgba(20,24,66,.92);border:1px solid var(--line);border-radius:22px;padding:8px 8px 8px 18px;transition:border-color .2s,box-shadow .2s}
.box:focus-within{border-color:var(--iris);box-shadow:0 0 0 4px rgba(140,155,255,.14)}
textarea{flex:1;resize:none;background:none;border:0;outline:0;color:var(--text);font:inherit;max-height:160px;padding:8px 0}
textarea::placeholder{color:var(--mute)}
.send{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--iris),var(--mint));color:#0d1030;display:grid;place-items:center;transition:transform .15s,opacity .2s}
.send:hover:not(:disabled){transform:scale(1.07)}.send:disabled{opacity:.35;cursor:default}
.note{max-width:780px;margin:8px auto 0;text-align:center;font-size:12.5px;color:var(--mute)}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:290px;z-index:5;transform:translateX(-100%);transition:transform .3s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:4;display:none}.scrim.show{display:block}
  .top{display:flex}
  .chips{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal>*{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="scrim" id="scrim"></div>

<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo" id="logo">A</div><span id="brandName">Portfolio</span></div>
    <button class="new" id="newChat">＋ New chat</button>
    <div class="hist-title">Chat history</div>
    <nav class="hist" id="hist"></nav>
    <div class="links" id="links"></div>
  </aside>

  <main class="main">
    <div class="top">
      <button id="menu" aria-label="Open chat history" style="font-size:22px">☰</button>
      <strong style="font-family:var(--display)" id="topName"></strong>
    </div>
    <div class="stream" id="stream"><div class="col" id="col"></div></div>
    <div class="comp">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Ask about my skills, projects or experience…" aria-label="Your question"></textarea>
        <button class="send" id="send" aria-label="Send question" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="note">Answers come from my résumé through an AI assistant. Press Enter to send.</div>
    </div>
  </main>
</div>

<script>
/* ============ EDIT THESE ============ */
const CONFIG = {
  API_URL: "http://127.0.0.1:8000",      // your FastAPI server (no trailing slash)
  NAME: "Manoj",
  ROLE: "AI / Full-Stack Developer",
  INTRO: "I built an AI assistant that has read my résumé. Ask it anything about my skills, projects and experience, the same way an interviewer would.",
  SKILLS: ["Python","FastAPI","LLMs","Groq","Prompt Engineering","React","SQL","Docker","Git","REST APIs","Machine Learning"],
  SUGGESTIONS: [
    "What are your key technical skills?",
    "Tell me about your work experience",
    "Which projects have you built?",
    "What is your educational background?"
  ],
  LINKS: [["GitHub","https://github.com/"],["LinkedIn","https://linkedin.com/"],["Email","mailto:you@example.com"]]
};
/* ==================================== */

const $ = id => document.getElementById(id);
const KEY = "portfolio-chats-v1";
let chats = [], current = null, busy = false;

try { chats = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e) { chats = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(chats)); } catch(e) {} };

/* tiny, safe markdown */
function md(t){
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
  let out = "", list = null;
  const close = () => { if(list){ out += `</${list}>`; list = null; } };
  for (const line of t.split("\n")) {
    let m;
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if(list!=="ul"){close();out+="<ul>";list="ul";} out += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if(list!=="ol"){close();out+="<ol>";list="ol";} out += `<li>${inline(m[1])}</li>`; }
    else if (line.trim()) { close(); out += `<p>${inline(line)}</p>`; }
    else close();
  }
  close(); return out;
}

/* sidebar */
function renderHist(){
  const h = $("hist"); h.innerHTML = "";
  if (!chats.length) { h.innerHTML = '<div class="empty">Your conversations will appear here.</div>'; return; }
  chats.forEach(c => {
    const el = document.createElement("div");
    el.className = "item" + (c.id === current ? " on" : "");
    el.tabIndex = 0;
    el.innerHTML = `<span></span><button class="del" aria-label="Delete chat">×</button>`;
    el.firstChild.textContent = c.title;
    el.onclick = () => { openChat(c.id); closeSide(); };
    el.onkeydown = e => { if (e.key === "Enter") el.click(); };
    el.querySelector(".del").onclick = e => { e.stopPropagation(); chats = chats.filter(x => x.id !== c.id); save(); if (current === c.id) newChat(); else renderHist(); };
    h.appendChild(el);
  });
}

/* views */
function showHero(){
  $("col").innerHTML = `<div class="hero reveal">
    <span class="hi"><i class="dot"></i> Ask my AI assistant</span>
    <h1>${CONFIG.NAME}</h1>
    <p class="lead"><b style="color:var(--text);font-weight:600">${CONFIG.ROLE}.</b> ${CONFIG.INTRO}</p>
    <div class="marquee"><div class="track">${[...CONFIG.SKILLS,...CONFIG.SKILLS].map(s=>`<b>${s}</b>`).join("")}</div></div>
    <div class="chips">${CONFIG.SUGGESTIONS.map(s=>`<button class="chip">${s}</button>`).join("")}</div>
  </div>`;
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => ask(b.textContent));
}
function addMsg(role, text, opts = {}){
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot") + (opts.err ? " err" : "");
  d.innerHTML = (role === "user" ? "" : `<div class="av">${CONFIG.NAME.trim()[0] || "A"}</div>`) + `<div class="bub"></div>`;
  const b = d.querySelector(".bub");
  if (role === "user") b.textContent = text; else if (text) b.innerHTML = md(text);
  $("col").appendChild(d); scroll(); return b;
}
const scroll = () => { const s = $("stream"); s.scrollTop = s.scrollHeight; };

function openChat(id){
  current = id; const c = chats.find(x => x.id === id);
  $("col").innerHTML = "";
  c.messages.forEach(m => addMsg(m.role, m.text, { err: m.err }));
  renderHist(); $("input").focus();
}
function newChat(){
  current = null; showHero(); renderHist(); $("input").focus();
}

/* typewriter reveal, like ChatGPT */
function reveal(bub, text){
  return new Promise(res => {
    const words = text.split(/(\s+)/); let i = 0;
    const tick = () => {
      i = Math.min(words.length, i + 3);
      bub.innerHTML = md(words.slice(0, i).join("")); scroll();
      i < words.length ? setTimeout(tick, 28) : res();
    };
    tick();
  });
}

/* ask the FastAPI server */
async function ask(q){
  q = q.trim(); if (!q || busy) return;
  busy = true; $("send").disabled = true;
  let chat = chats.find(c => c.id === current);
  if (!chat) {
    chat = { id: Date.now().toString(36), title: q.length > 34 ? q.slice(0, 34) + "…" : q, messages: [] };
    chats.unshift(chat); current = chat.id; $("col").innerHTML = "";
  }
  chat.messages.push({ role: "user", text: q }); addMsg("user", q); renderHist();
  $("input").value = ""; autosize();

  const bub = addMsg("bot", "");
  bub.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
  try {
    const r = await fetch(CONFIG.API_URL + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q })
    });
    if (!r.ok) throw new Error("Server replied with status " + r.status);
    const data = await r.json();
    const answer = data.answer || "I don't have enough information to answer that.";
    bub.innerHTML = ""; await reveal(bub, answer);
    chat.messages.push({ role: "bot", text: answer });
  } catch (e) {
    const msg = "Couldn't reach the assistant. Check that the FastAPI server is running at " + CONFIG.API_URL + " and that CORS is enabled. (" + e.message + ")";
    bub.parentElement.classList.add("err"); bub.textContent = msg;
    chat.messages.push({ role: "bot", text: msg, err: true });
  }
  save(); busy = false; updateSend(); $("input").focus();
}

/* composer */
const inp = $("input");
function autosize(){ inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 160) + "px"; updateSend(); }
function updateSend(){ $("send").disabled = busy || !inp.value.trim(); }
inp.addEventListener("input", autosize);
inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(inp.value); } });
$("send").onclick = () => ask(inp.value);
$("newChat").onclick = () => { newChat(); closeSide(); };

/* mobile drawer */
const closeSide = () => { $("side").classList.remove("open"); $("scrim").classList.remove("show"); };
$("menu").onclick = () => { $("side").classList.add("open"); $("scrim").classList.add("show"); };
$("scrim").onclick = closeSide;

/* init */
$("brandName").textContent = CONFIG.NAME; $("topName").textContent = CONFIG.NAME;
$("logo").textContent = CONFIG.NAME.trim()[0] || "A";
$("links").innerHTML = CONFIG.LINKS.map(([n,u]) => `<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join("");
document.title = "Ask " + CONFIG.NAME + "'s AI";
showHero(); renderHist();
</script>
</body>
</html>
